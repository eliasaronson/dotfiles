# mpv defaults to hwdec=no, so hardware decoding is opt-in even with a VA-API driver
# installed. auto-safe only picks hwdec combinations known not to produce broken output
# and falls back to software silently when none fits.
# The driver comes from hardware.graphics.extraPackages (intel-media-driver) in
# ~/nixos-config/configuration.nix; list what it supports with `vainfo`.
hwdec=auto-safe

# Pin decoding to the Intel iGPU. renderD128 is i915, renderD129 is the NVIDIA dGPU
# (checked 2026-10-16). The dGPU is offload-only and the displays scan out on Intel, so
# decoding there would wake an otherwise-idle ~1-2W GPU and copy every frame over PCIe.
vaapi-device=/dev/dri/renderD128

# NOTE: gpu-context is deliberately left at auto. This box runs sway (Wayland) AND keeps
# i3 (X11) as a login option, so hardcoding wayland would break mpv in the i3 session.
