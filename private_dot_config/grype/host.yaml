# Ignore list for host-vuln-scan (~/.local/bin/host-vuln-scan).
#
# Same convention as evals5's .github/grype/nix-api.yaml: pin each entry to the installed
# VERSION rather than a date, so the ignore expires by itself as soon as nixpkgs ships a
# different build and the finding needs a fresh look.
#
# Every finding on a Nix closure comes from grype's nvd:cpe source (CPE string matching),
# so before adding an entry decide which kind it is:
#   * CPE collision     -> the CVE is for a different project that shares the name. The
#                          give-away is an impossible "FIXED-IN" (ranger showed Apache
#                          Ranger's 2.9.0; the file manager has only had 1.9.x).
#   * version artefact  -> the fix IS installed, but CPE string comparison orders the
#                          versions wrongly (see dnsmasq below).
#   * wrong platform    -> the bug is real but Windows/macOS-only.
#   * not reachable     -> real bug, but nothing here exercises the affected code path.
#   * waiting on a pin  -> real and reachable; prefer `nix flake update && nrs` over an
#                          ignore. Only park it here if the update is blocked.
# Say which one it is in the reason, like the CI config does.
#
# ranger is not listed: it was dropped from systemPackages instead (it accounted for 7 of
# the original 13 high/critical findings, all of them Apache Ranger collisions).
# libpcap and libmicrohttpd are deliberately NOT listed: nixpkgs master already has 1.10.7
# and 1.0.10, so `nix flake update && nrs` is the correct fix and they should stay visible
# until it runs.
# curl CVE-2026-92392 is deliberately NOT ignored. HTTP/2 upload use-after-free, High,
# affects 8.12.0-8.22.0, fixed in 8.23.0. Installed is 8.22.0 -- genuinely affected. As of
# 2026-10-22 nixpkgs has 8.22.0 on unstable AND on master, so there is nothing to pull
# forward; this is "waiting on a pin" and must stay visible until a fixed curl lands.
# Re-check with: nix eval --raw github:NixOS/nixpkgs/master#curl.version

ignore:
  # --- dnsmasq: version artefact ---------------------------------------------------------
  # 2.93test9 is a PRE-release of 2.93, so the installed 2.93 final already contains the
  # fix -- but CPE comparison sorts "2.93" before "2.93test9" and flags it. Pulled in by
  # networkmanager and blueman, not installed directly.
  - vulnerability: CVE-2026-6507
    reason: >-
      Version artefact: fixed-in 2.93test9 is a prerelease of the installed 2.93 final, so
      the fix is already present; CPE string ordering puts 2.93 below 2.93test9.
    package:
      name: dnsmasq
      version: "2.93"

  # --- openvpn: Windows-only, plus an unreachable DoS ------------------------------------
  # Present only as a dependency of nordvpn-cli; nordvpn runs Technology: NORDLYNX
  # (WireGuard), so the OpenVPN code path is never executed. REVISIT IF YOU EVER RUN
  # `nordvpn set technology openvpn` -- nordvpnd runs as root, so anything it spawns is
  # privileged. Also note every affected range ends at "2.6.22 and 2.7.6" while the
  # installed build is 2.6.23, i.e. one patch past the 2.6-branch ceiling; grype only
  # flags it because the recorded fix version is 2.7.7, from the other release branch.
  - vulnerability: CVE-2026-84256
    reason: >-
      Wrong platform: Windows-only (argument parsing via a crafted certificate subject,
      needs an authenticated user); this is Linux.
    package:
      name: openvpn
      version: 2.6.23
  - vulnerability: CVE-2026-81738
    reason: >-
      Wrong platform: Windows-only (tap-windows6 driver, DOMAIN-SEARCH out-of-bounds
      write); this is Linux.
    package:
      name: openvpn
      version: 2.6.23
  - vulnerability: CVE-2026-84732
    reason: >-
      Not reachable: remote unauthenticated DoS (ACK packet-ID retransmission timeout
      overflow), not RCE, and openvpn never runs because nordvpn uses NordLynx/WireGuard.
      Affected range ends at 2.6.22; installed is 2.6.23.
    package:
      name: openvpn
      version: 2.6.23

  # --- mujs: version artefacts (and not reachable) ---------------------------------------
  # Four of the eight high/critical findings on 2026-10-23 were mujs 1.3.6, from a batch of
  # 2016-2017 fuzzing bugs. Two independent reasons they do not apply:
  #   * Version artefact: every FIXED-IN is a DATE, not a version ("2017-01-12",
  #     "2016-10-26") -- the tell this file's header describes. NVD recorded upstream commit
  #     dates, all of them predating mujs 1.0.0; the installed 1.3.6 is many releases later.
  #   * Not reachable: mujs is in the closure only as mpv's JavaScript engine for user
  #     scripts (`nix-store -q --referrers` -> mpv-0.41.0 only). Nothing here ships an mpv
  #     JS script, so the interpreter is never fed untrusted input.
  # REVISIT IF you start using mpv JS user scripts from the internet.
  - vulnerability: CVE-2016-10141
    reason: >-
      Version artefact: fixed-in is the date 2017-01-12, a pre-1.0.0 commit; installed is
      1.3.6. Also not reachable -- mujs is only mpv's JS engine and no JS scripts are used.
    package:
      name: mujs
      version: 1.3.6
  - vulnerability: CVE-2016-9294
    reason: >-
      Version artefact: fixed-in is the date 2016-10-26, a pre-1.0.0 commit; installed is
      1.3.6. Also not reachable -- see CVE-2016-10141 above.
    package:
      name: mujs
      version: 1.3.6
  - vulnerability: CVE-2017-5627
    reason: >-
      Version artefact: fixed-in is the date 2017-01-24, a pre-1.0.0 commit; installed is
      1.3.6. Also not reachable -- see CVE-2016-10141 above.
    package:
      name: mujs
      version: 1.3.6
  - vulnerability: CVE-2017-5628
    reason: >-
      Version artefact: fixed-in is the date 2017-01-24, a pre-1.0.0 commit; installed is
      1.3.6. Also not reachable -- see CVE-2016-10141 above.
    package:
      name: mujs
      version: 1.3.6

  # --- linux: version artefact -----------------------------------------------------------
  # CVE-2020-27815 is a JFS out-of-bounds write fixed in 2020. grype reports FIXED-IN as
  # "4.9.249, 4.14.213, 4.19.164, 5.4.86, ..." -- every entry is a 4.x/5.x stable backport,
  # and CPE comparison cannot tell that the installed 7.3 is far past all of them. JFS is
  # also not built into this kernel's filesystems in use.
  - vulnerability: CVE-2020-27815
    reason: >-
      Version artefact: all fixed-in versions are 4.x/5.x stable backports from 2020 and
      the installed kernel is 7.3; CPE ordering cannot compare across those branches.
    package:
      name: linux
      version: "7.3"

  # --- codex: CPE collision --------------------------------------------------------------
  # CVE-2021-43635 with FIXED-IN "1.4.0" is not OpenAI's codex CLI (installed 0.163.0). It
  # belongs to a different project sharing the name -- the same failure mode as ranger
  # matching Apache Ranger. A 2021 CVE cannot apply to a 2026 tool that did not exist.
  - vulnerability: CVE-2021-43635
    reason: >-
      CPE collision: a 2021 advisory for an unrelated project named codex; the installed
      codex is OpenAI's CLI at 0.163.0, which postdates the CVE entirely.
    package:
      name: codex
      version: 0.163.0

  # --- dhcpcd: not reachable -------------------------------------------------------------
  # CVE-2026-56116 is real (fixed upstream in 10.5.0; nixpkgs has 10.3.2 on unstable,
  # master AND staging, so there is nothing to pull forward). But dhcpcd never executes on
  # this host, verified 2026-10-23:
  #     systemctl is-active dhcpcd.service   -> inactive
  #     systemctl is-enabled dhcpcd.service  -> not-found   (no unit at all)
  #     /etc/NetworkManager/NetworkManager.conf:18  dhcp=internal
  # NetworkManager uses its own built-in DHCP client, so dhcpcd sits in the closure
  # unreferenced and unrun.
  # REVISIT IF you set `dhcp=dhcpcd` in NetworkManager, or enable networking.useDHCP /
  # services.dhcpcd -- it would then run as root on untrusted network input.
  - vulnerability: CVE-2026-56116
    reason: >-
      Not reachable: no dhcpcd unit exists on this host and NetworkManager is configured
      dhcp=internal, so the binary never runs. Genuinely unfixed in nixpkgs (10.3.2 vs
      10.5.0) but unexecuted.
    package:
      name: dhcpcd
      version: 10.3.2
