# xdg-desktop-portal routing for the sway session (XDG_CURRENT_DESKTOP=sway ->
# this file wins over the nixos common.default). gtk serves the Settings interface
# (org.freedesktop.appearance color-scheme) so libadwaita apps (nautilus) follow
# prefer-dark; wlr serves screenshot/screencast.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
