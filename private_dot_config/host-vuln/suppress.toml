# Suppressions for host-vuln-scan, covering BOTH passes (CPE and distro feeds).
#
# This file holds ONLY judgement calls that no rule can make. Everything mechanical is
# now derived by host-vuln-filter and appears in the report under a `removed` reason
# rather than being configured here:
#
#   artefact:date    fix version is a date, not a version  (was: 4 mujs entries)
#   artefact:prerel  fix version is a prerelease           (was: the dnsmasq entry)
#   already-fixed    installed is past every recorded fix  (was: the linux entry)
#   patched          the nixpkgs derivation patches the CVE (was: nothing -- these were
#                                                            never suppressed at all)
#
# So what belongs here is the irreducible set: wrong platform, not reachable, and CPE
# collisions between projects that share a name.
#
# `version` pins the entry to the installed build, so it expires by itself as soon as
# nixpkgs ships a different one and the finding needs a fresh look. Always say WHICH
# category the reason is, and what would make it stop being true.
#
# `pass` is "both" (default), "cpe", or "distro".

# --- codex: CPE collision --------------------------------------------------------------
[[ignore]]
id = "CVE-2021-43635"
package = "codex"
version = "0.163.0"
reason = """CPE collision: a 2021 advisory (fix 1.4.0) for an unrelated project named \
codex. The installed codex is OpenAI's CLI at 0.163.0, which postdates the CVE entirely."""

# --- lua: not affected, wrong branch ---------------------------------------------------
# CVE-2021-43519 is a stack overflow in lua_resume affecting Lua 5.4.0-5.4.2. grype
# reports it against 5.1.5 and 5.2.4 only because both sort below the recorded fix
# versions 5.3.5/5.4.4 -- neither branch contains the affected code.
[[ignore]]
id = "CVE-2021-43519"
package = "lua"
version = "5.1.5"
reason = """Not affected: the lua_resume stack overflow is in the 5.4.0-5.4.2 code, and \
5.1.5 predates that branch; it is flagged only because 5.1.5 sorts below fix 5.3.5."""

[[ignore]]
id = "CVE-2021-43519"
package = "lua"
version = "5.2.4"
reason = """Not affected: the lua_resume stack overflow is in the 5.4.0-5.4.2 code, and \
5.2.4 predates that branch; it is flagged only because 5.2.4 sorts below fix 5.3.5."""

# --- openvpn: Windows-only, plus an unreachable DoS ------------------------------------
# Present only as a dependency of nordvpn-cli, which runs Technology: NORDLYNX
# (WireGuard), so the OpenVPN code path never executes. REVISIT IF you ever run
# `nordvpn set technology openvpn` -- nordvpnd runs as root, so anything it spawns is
# privileged. Note every affected range ends at "2.6.22 and 2.7.6" while the installed
# build is 2.6.23, one patch past the 2.6-branch ceiling; grype flags it only because the
# recorded fix 2.7.7 comes from the other release branch.
[[ignore]]
id = "CVE-2026-84256"
package = "openvpn"
version = "2.6.23"
reason = """Wrong platform: Windows-only (argument parsing via a crafted certificate \
subject, needs an authenticated user); this is Linux."""

[[ignore]]
id = "CVE-2026-81738"
package = "openvpn"
version = "2.6.23"
reason = """Wrong platform: Windows-only (tap-windows6 driver, DOMAIN-SEARCH \
out-of-bounds write); this is Linux."""

[[ignore]]
id = "CVE-2026-84732"
package = "openvpn"
version = "2.6.23"
reason = """Not reachable: remote unauthenticated DoS (ACK packet-ID retransmission \
timeout overflow), not RCE, and openvpn never runs because nordvpn uses NordLynx. \
Affected range ends at 2.6.22; installed is 2.6.23."""

# --- dhcpcd: not reachable -------------------------------------------------------------
# Real and unfixed in nixpkgs (10.3.2 against upstream 10.5.0, same on unstable, master
# and staging), but dhcpcd never executes here. Verified 2026-10-23:
#     systemctl is-active dhcpcd.service   -> inactive
#     systemctl is-enabled dhcpcd.service  -> not-found   (no unit at all)
#     /etc/NetworkManager/NetworkManager.conf:18  dhcp=internal
# REVISIT IF you set dhcp=dhcpcd in NetworkManager, or enable networking.useDHCP /
# services.dhcpcd -- it would then run as root on untrusted network input.
[[ignore]]
id = "CVE-2026-56116"
package = "dhcpcd"
version = "10.3.2"
reason = """Not reachable: no dhcpcd unit exists on this host and NetworkManager is \
configured dhcp=internal, so the binary never runs."""
