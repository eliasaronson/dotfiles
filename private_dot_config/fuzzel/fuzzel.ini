# fuzzel launcher — dark theme matching wezterm (badwolf) / mako.
[main]
font=JetBrainsMono Nerd Font:size=12
terminal=wezterm start --
layer=overlay
width=40
horizontal-pad=20
vertical-pad=12
inner-pad=6

[colors]
background=1c1b1aee
text=f8f6f2ff
match=0a9dffff
selection=45413bff
selection-text=ffffffff
selection-match=0a9dffff
border=0a9dffff

[border]
width=2
radius=6
